name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to deploy
        required: true
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: npm run build
      - name: Package web build
        run: tar -C dist -czf gc-web.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: gc-web
          path: gc-web.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VM
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: gc-web
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
        run: |
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            gc-web.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/gc-web-$COMMIT_SHA.tar.gz"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "/home/nmfairus/gc-web/deploy/deploy.sh '$COMMIT_SHA' '/tmp/gc-web-$COMMIT_SHA.tar.gz'"
